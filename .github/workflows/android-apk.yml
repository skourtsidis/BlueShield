name: Build Android APK (BlueShield)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Create / sync Android project (Capacitor)
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Generate app icon & splash (optional)
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android

      - name: Setup Gradle for wrapper recovery
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Restore missing Gradle wrapper JAR
        shell: bash
        run: |
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            temp_project=$(mktemp -d)
            printf "rootProject.name = 'wrapper-recovery'\n" > "$temp_project/settings.gradle"
            gradle -p "$temp_project" wrapper --gradle-version 8.14.3 --no-daemon
            mkdir -p android/gradle/wrapper
            cp "$temp_project/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueShield-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
